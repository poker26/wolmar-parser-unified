<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'monospace'],
      },
      colors: {
        ink: {
          950: '#070a12', 900: '#0c111d', 850: '#111726', 800: '#161d2e',
          700: '#1f2940', 600: '#2b3650', 500: '#3a4666',
        },
        gold: {
          300: '#f6d98a', 400: '#eec05a', 500: '#e0a92e', 600: '#c2891b',
        },
      },
      boxShadow: {
        glow: '0 0 0 1px rgba(238,192,90,.12), 0 12px 40px -12px rgba(0,0,0,.7)',
      },
    },
  },
};
</script>
<style>
  body { background:
      radial-gradient(1200px 600px at 80% -10%, rgba(238,192,90,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(99,102,241,.07), transparent 55%),
      #070a12; }
  .tnum { font-variant-numeric: tabular-nums; }
  .glass { background: rgba(12,17,29,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .card { transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s; }
  .card:hover { transform: translateY(-4px); border-color: rgba(238,192,90,.35); box-shadow: 0 20px 50px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(238,192,90,.15); }
  .coin-img { transition: transform .4s ease; }
  .card:hover .coin-img { transform: scale(1.06); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1f2940; border-radius: 8px; }
  .fade { animation: fade .5s ease both; }
  @keyframes fade { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none;} }
  .skel { background: linear-gradient(90deg,#111726 25%,#1a2236 37%,#111726 63%); background-size:400% 100%; animation: sh 1.4s ease infinite; }
  @keyframes sh { 0%{background-position:100% 0} 100%{background-position:0 0} }
</style>
</head>
<body class="font-sans text-slate-200 min-h-screen antialiased">

<!-- ===== Header ===== -->
<header class="glass sticky top-0 z-30 border-b border-ink-700/70">
  <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
    <a href="/auctions.html" class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 grid place-items-center shadow-glow">
        <i data-lucide="coins" class="w-5 h-5 text-ink-950"></i>
      </div>
      <div class="leading-tight">
        <div class="font-extrabold tracking-tight text-white">Begemot<span class="text-gold-400">·</span>Numismatics</div>
        <div class="text-[11px] text-slate-400 -mt-0.5" id="brandSub">текущий аукцион</div>
      </div>
    </a>
    <nav class="hidden md:flex items-center gap-1 text-sm">
      <a href="/auctions.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Аукционы</a>
      <a href="/catalog-coins.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Каталог</a>
      <a href="/current.html" class="px-3 py-1.5 rounded-lg bg-ink-700/70 text-white">Текущий</a>
      <a href="/search.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Поиск</a>
      <a href="/watchlist" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Избранное</a>
      <a href="/collection" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Коллекция</a>
      <a href="/analytics" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-ink-700/60">Аналитика</a>
    </nav>
    <div class="flex items-center gap-2">
      <div class="relative hidden sm:block">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
        <input id="search" placeholder="Поиск лота…" class="bg-ink-850 border border-ink-700 rounded-lg pl-9 pr-3 py-1.5 text-sm w-48 focus:outline-none focus:border-gold-500/60">
      </div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-5 py-8">

  <!-- ===== Title + KPIs ===== -->
  <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
    <div>
      <div id="statusBadge" class="inline-flex items-center gap-2 text-xs font-medium text-gold-300 bg-gold-500/10 border border-gold-500/20 rounded-full px-3 py-1 mb-3">
        <span class="w-1.5 h-1.5 rounded-full bg-gold-400 animate-pulse"></span> Загрузка…
      </div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Текущий аукцион <span id="auctionTitleNum" class="text-gold-400"></span></h1>
      <p class="text-slate-400 mt-1">Лоты отсортированы по недооценке: где прогноз выше текущей ставки.</p>
    </div>
    <div class="grid grid-cols-4 gap-3" id="kpis"></div>
  </div>

  <!-- ===== Filters ===== -->
  <div class="space-y-3 mb-6" id="filters">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-sm text-slate-500 mr-1 w-[78px] shrink-0">Категория:</span>
      <span id="catChips" class="flex flex-wrap gap-2"></span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-sm text-slate-500 mr-1 w-[78px] shrink-0">Металл:</span>
      <span id="metalChips" class="flex flex-wrap gap-2"></span>
      <span class="mx-1 w-px h-5 bg-ink-700"></span>
      <button id="underToggle" onclick="toggleUnder()" class="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border transition bg-ink-900/60 border-ink-700 text-slate-300 hover:border-ink-500">
        <i data-lucide="trending-up" class="w-3.5 h-3.5"></i>Только недооценённые
      </button>
    </div>
  </div>

  <!-- ===== Grid ===== -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="grid"></div>

  <!-- ===== Pagination ===== -->

  <p class="text-center text-xs text-slate-600 mt-6" id="footnote"></p>
</main>

<script>
// ===================== Data layer =====================
const PER_PAGE = 24;
let RAW = [];        // mapped lots with prediction
let activeMetal = 'all';
let activeCat = 'all';   // фильтр по категории (значение DB-поля category)
let underOnly = false;   // показывать только недооценённые (прогноз ≥ ставки)
let query = '';
let page = 1;
let auctionMeta = { auctionNumber: null, isActive: false, lotsCount: 0 };

const METAL = {
  Au: {label:"Золото", dot:"bg-amber-400",  badge:"bg-amber-400/15 text-amber-300 border-amber-400/25"},
  Ag: {label:"Серебро", dot:"bg-slate-300", badge:"bg-slate-300/15 text-slate-200 border-slate-300/25"},
  Pd: {label:"Палладий", dot:"bg-sky-300",  badge:"bg-sky-300/15 text-sky-200 border-sky-300/25"},
  Pt: {label:"Платина", dot:"bg-teal-200",  badge:"bg-teal-200/15 text-teal-100 border-teal-200/25"},
  Cu: {label:"Медь", dot:"bg-orange-400",   badge:"bg-orange-400/15 text-orange-300 border-orange-400/25"},
  Other: {label:"Другой", dot:"bg-slate-500", badge:"bg-slate-500/15 text-slate-300 border-slate-500/25"},
};
const METHOD = {
  statistical_model: "Модель",
  statistical_model_relaxed: "Модель · расшир.",
  single_analog: "1 аналог",
  no_similar: "Нет аналогов",
};
const fmt = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';

// Normalize DB metal value → our key
function normMetal(m){
  if (!m) return 'Other';
  const s = String(m).trim().toLowerCase();
  if (['au','золото','gold'].includes(s)) return 'Au';
  if (['ag','серебро','silver'].includes(s)) return 'Ag';
  if (['pd','палладий','palladium'].includes(s)) return 'Pd';
  if (['pt','платина','platinum'].includes(s)) return 'Pt';
  if (['cu','медь','copper','бронза','bronze','латунь'].includes(s)) return 'Cu';
  return 'Other';
}

function confTone(c){
  if (c >= .8) return {bar:'bg-emerald-400', txt:'text-emerald-300', lbl:'Высокая'};
  if (c >= .6) return {bar:'bg-amber-400',   txt:'text-amber-300',  lbl:'Средняя'};
  return {bar:'bg-rose-400', txt:'text-rose-300', lbl:'Низкая'};
}

// ===================== Risk (стоит ли вступать в торги) =====================
// Дёргаем /api/lots/:id/risk — оценка по репутации участников ставок (winner_ratings).
const RISK_CACHE = {};
// Тон по уровню — принимает и уровень лота («… РИСК»), и уровень участника.
function riskTone(level){
  switch(level){
    case 'КРИТИЧЕСКИЙ РИСК':
    case 'КРИТИЧЕСКИЙ':     return {badge:'bg-rose-500/15 text-rose-300 border-rose-400/30',   icon:'shield-alert'};
    case 'ВЫСОКИЙ РИСК':
    case 'ВЫСОКИЙ':         return {badge:'bg-orange-500/15 text-orange-300 border-orange-400/30', icon:'alert-triangle'};
    case 'СРЕДНИЙ РИСК':
    case 'ПОДОЗРИТЕЛЬНО':   return {badge:'bg-amber-500/15 text-amber-300 border-amber-400/30',  icon:'alert-circle'};
    case 'НИЗКИЙ РИСК':
    case 'ВНИМАНИЕ':        return {badge:'bg-sky-500/15 text-sky-300 border-sky-400/30',        icon:'info'};
    default:                return {badge:'bg-emerald-500/15 text-emerald-300 border-emerald-400/30', icon:'shield-check'};
  }
}
// Короткая подпись уровня лота для бейджа на карточке.
function riskShort(level){
  return ({'КРИТИЧЕСКИЙ РИСК':'Накрутчик','ВЫСОКИЙ РИСК':'Высокий риск','СРЕДНИЙ РИСК':'Средний риск',
           'НИЗКИЙ РИСК':'Низкий риск','НОРМА':'Чисто'})[level] || level;
}
async function loadLotRisk(id){
  if (RISK_CACHE[id] !== undefined) return RISK_CACHE[id];
  try { const r = await fetch(`/api/lots/${id}/risk`); RISK_CACHE[id] = r.ok ? await r.json() : null; }
  catch(_) { RISK_CACHE[id] = null; }
  return RISK_CACHE[id];
}
function renderRisk(id, d){
  const el = document.getElementById(`risk-${id}`);
  if (!el || !d) return;
  if (!d.total_participants){
    el.innerHTML = `<div class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-lg border bg-ink-800 text-slate-500 border-ink-600"><i data-lucide="users" class="w-3.5 h-3.5"></i>Ставок пока нет</div>`;
    lucide.createIcons(); return;
  }
  const t = riskTone(d.risk_level);
  const loud = d.risk_score >= 4; // крит/высокий — называем накрутчика и подсвечиваем балл
  // Левая часть: для крит/высокого — уровень + логин худшего участника, иначе просто уровень.
  const left = loud && d.top_offender
    ? `${riskShort(d.risk_level)} · ${D_esc(d.top_offender.bidder_login)}`
    : riskShort(d.risk_level);
  // Правая часть: макс. балл (если есть флаги) либо число участников.
  const right = d.max_score > 0
    ? `<span class="tnum font-bold ${loud?'px-1.5 py-0.5 rounded-md bg-black/25':''}">${d.max_score}</span>`
    : `${d.total_participants} уч.`;
  el.innerHTML = `<button onclick="showRiskDetails(${id})" class="w-full inline-flex items-center justify-between gap-2 text-[12px] font-medium px-2.5 py-1.5 rounded-lg border ${t.badge} hover:brightness-125 transition">
      <span class="inline-flex items-center gap-1.5 min-w-0"><i data-lucide="${t.icon}" class="w-3.5 h-3.5 shrink-0"></i><span class="truncate">${left}</span></span>
      <span class="opacity-90 shrink-0">${right}</span>
    </button>`;
  lucide.createIcons();
}
function D_esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function loadRisks(slice){
  await Promise.all((slice||[]).filter(l => l.id != null).map(async l => renderRisk(l.id, await loadLotRisk(l.id))));
}
async function showRiskDetails(id){
  const d = await loadLotRisk(id);
  if (!d) return;
  const t = riskTone(d.risk_level);
  const rows = (d.participants||[]).map(p => {
    const pt = riskTone(p.risk_level);
    const strong = p.suspicious_score >= 35;
    return `<div class="flex items-center justify-between py-2 px-3 rounded-lg ${strong?'bg-ink-800 border border-rose-400/20':'bg-ink-850 border border-ink-700'}">
        <a href="/user.html?login=${encodeURIComponent(p.bidder_login)}" class="text-gold-300 hover:text-gold-200 hover:underline decoration-dotted underline-offset-2 text-sm truncate">${D_esc(p.bidder_login)}</a>
        <span class="inline-flex items-center gap-2 shrink-0">
          ${p.suspicious_score>0 ? `<span class="text-[11px] px-2 py-0.5 rounded-md border ${pt.badge}">${p.risk_level}</span>` : `<span class="text-[11px] text-slate-600">норма</span>`}
          <span class="text-xs ${strong?'text-rose-300 font-bold':'text-slate-500'} font-mono tnum w-10 text-right">${p.suspicious_score}</span>
        </span>
      </div>`;
  }).join('');
  // Подсказка про худшего участника (накрутчика), если есть.
  const offenderBlock = (d.top_offender && d.top_offender.suspicious_score >= 35)
    ? `<div class="mx-5 mt-4 rounded-xl border border-rose-400/30 bg-rose-500/10 px-4 py-3">
         <div class="text-[11px] uppercase tracking-wide text-rose-300/80">Главный риск</div>
         <div class="mt-0.5 flex items-center justify-between gap-2">
           <a href="/user.html?login=${encodeURIComponent(d.top_offender.bidder_login)}" class="text-rose-200 font-semibold hover:underline truncate">${D_esc(d.top_offender.bidder_login)}</a>
           <span class="text-sm text-rose-300">${d.top_offender.risk_level} · балл ${d.top_offender.suspicious_score}</span>
         </div>
       </div>` : '';
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 fade';
  modal.onclick = e => { if (e.target === modal) close(); };
  function close(){ modal.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  modal.innerHTML = `<div class="bg-ink-900 border border-ink-700 rounded-2xl w-full max-w-lg max-h-[85vh] overflow-hidden shadow-glow flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-ink-700">
        <div class="inline-flex items-center gap-2"><i data-lucide="${t.icon}" class="w-5 h-5"></i><h3 class="font-bold text-white">Риск торгов: ${riskShort(d.risk_level)}</h3></div>
        <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      ${offenderBlock}
      <div class="px-5 py-4 grid grid-cols-3 gap-3 border-b border-ink-700">
        <div class="rounded-xl bg-ink-850 border border-ink-700 px-3 py-2"><div class="text-[11px] text-slate-500">Участников</div><div class="text-lg font-bold text-white tnum">${d.total_participants}</div></div>
        <div class="rounded-xl bg-ink-850 border border-ink-700 px-3 py-2"><div class="text-[11px] text-slate-500">Подозрительных</div><div class="text-lg font-bold text-amber-300 tnum">${d.suspicious_count}</div></div>
        <div class="rounded-xl bg-ink-850 border border-ink-700 px-3 py-2"><div class="text-[11px] text-slate-500">Макс. балл</div><div class="text-lg font-bold ${d.max_score>=35?'text-rose-300':'text-slate-300'} tnum">${d.max_score}</div></div>
      </div>
      <div class="px-5 py-4 overflow-y-auto space-y-2">
        <div class="text-[11px] uppercase tracking-wide text-slate-500 mb-1">Участники (по убыванию балла). Балл репутации: ≥50 крит · ≥35 высокий · ≥20 подозр. · &gt;0 внимание.</div>
        ${rows || '<div class="text-slate-500 text-sm">Нет данных об участниках.</div>'}
      </div>
    </div>`;
  document.body.appendChild(modal);
  lucide.createIcons();
}

// ===================== Watchlist (★ Избранное) =====================
// Один раз грузим весь список избранного в Set, дальше звёзды рисуем по членству.
const WATCH_SET = new Set();
let WATCH_READY = false;
async function loadWatchlistSet(){
  try {
    const r = await fetch('/api/watchlist');
    if (r.ok){ const d = await r.json(); (d.lots||[]).forEach(l => WATCH_SET.add(String(l.id))); }
  } catch(_){}
  WATCH_READY = true;
}
function starBtnHtml(id){
  const on = WATCH_SET.has(String(id));
  return `<button onclick="toggleWatch(event, ${id})" data-star="${id}" title="${on?'В избранном':'В избранное'}"
      class="absolute top-3 right-3 z-10 grid place-items-center w-8 h-8 rounded-lg bg-ink-950/70 border ${on?'border-gold-400/50 text-gold-300':'border-ink-600 text-slate-400'} hover:text-gold-200 hover:border-gold-400/60 transition">
      <i data-lucide="star" class="w-4 h-4" ${on?'fill="currentColor"':''}></i>
    </button>`;
}
function refreshStar(id){
  const btn = document.querySelector(`[data-star="${id}"]`);
  if (!btn) return;
  const on = WATCH_SET.has(String(id));
  btn.className = `absolute top-3 right-3 z-10 grid place-items-center w-8 h-8 rounded-lg bg-ink-950/70 border ${on?'border-gold-400/50 text-gold-300':'border-ink-600 text-slate-400'} hover:text-gold-200 hover:border-gold-400/60 transition`;
  btn.title = on ? 'В избранном' : 'В избранное';
  btn.innerHTML = `<i data-lucide="star" class="w-4 h-4" ${on?'fill="currentColor"':''}></i>`;
  lucide.createIcons();
}
async function toggleWatch(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const key = String(id);
  const on = WATCH_SET.has(key);
  // оптимистично переключаем
  if (on) WATCH_SET.delete(key); else WATCH_SET.add(key);
  refreshStar(id);
  try {
    if (on){
      await fetch(`/api/watchlist/${id}`, { method:'DELETE' });
    } else {
      await fetch('/api/watchlist', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lotId: id }) });
    }
  } catch(_){
    // откат при ошибке
    if (on) WATCH_SET.add(key); else WATCH_SET.delete(key);
    refreshStar(id);
  }
}

// Map an API prediction row → card model
function mapRow(r){
  const pred = r.predicted_price != null ? Number(r.predicted_price) : null;
  // На активном аукционе берём наибольшую из двух актуальных ставок:
  // current_bid_amount (история lot_bids) и winning_bid (дешёвый свип).
  // История может отставать от свежего свипа финалок — поэтому GREATEST.
  const _cb = r.current_bid_amount != null ? Number(r.current_bid_amount) : null;
  const _wb = r.winning_bid != null ? Number(r.winning_bid) : null;
  const bid  = (_cb != null || _wb != null) ? Math.max(_cb ?? 0, _wb ?? 0) : 0;
  return {
    id: r.id,
    n: r.lot_number,
    metal: normMetal(r.metal),
    metalRaw: r.metal,
    cat: (r.category && String(r.category).trim()) || null,
    grade: r.condition || '—',
    year: r.year || '',
    bid,
    pred,
    conf: r.confidence_score != null ? Number(r.confidence_score) : 0,
    method: r.prediction_method || 'no_similar',
    size: r.sample_size != null ? Number(r.sample_size) : 0,
    mv: r.metal_value != null ? Number(r.metal_value) : 0,
    np: r.numismatic_premium != null ? Number(r.numismatic_premium) : 0,
    t: r.coin_description || `Лот №${r.lot_number}`,
    img: r.avers_image_url || r.revers_image_url || '',
    url: r.source_url || '',
  };
}

function card(l){
  const m = METAL[l.metal] || METAL.Other;
  const lotHref = l.id != null ? `/lot.html?id=${l.id}` : (l.url || '#');

  const imgBlock = `
    <a href="${lotHref}" class="block relative h-44 overflow-hidden bg-ink-850">
      ${l.img ? `<img src="${l.img}" alt="" loading="lazy" class="coin-img w-full h-full object-cover"
           onerror="this.style.display='none';this.parentNode.classList.add('grid','place-items-center');this.parentNode.insertAdjacentHTML('beforeend','<i data-lucide=&quot;image-off&quot; class=&quot;w-8 h-8 text-ink-500&quot;></i>');lucide.createIcons();">`
        : `<div class="w-full h-full grid place-items-center"><i data-lucide="image-off" class="w-8 h-8 text-ink-500"></i></div>`}
      <div class="absolute inset-0 bg-gradient-to-t from-ink-900 via-ink-900/10 to-transparent pointer-events-none"></div>
      <div class="absolute top-3 left-3 flex gap-2">
        <span class="text-[11px] font-semibold px-2 py-1 rounded-md border ${m.badge}">${m.label}</span>
        <span class="text-[11px] font-semibold px-2 py-1 rounded-md bg-ink-950/70 border border-ink-600 text-slate-200">${l.grade}</span>
      </div>
      <span class="absolute top-3 right-14 text-[11px] font-mono text-slate-400 bg-ink-950/70 border border-ink-600 px-2 py-1 rounded-md">№${l.n}</span>
      <div class="absolute bottom-3 left-3 right-3 pointer-events-none">
        <h3 class="text-white font-semibold leading-snug line-clamp-2 drop-shadow">${l.t}</h3>
        <div class="text-xs text-slate-400 mt-0.5">${l.year ? l.year + ' г.' : ''}</div>
      </div>
    </a>`;

  // --- Лот без прогноза: показываем ставку и понятную метку ---
  if (l.pred == null){
    return `
    <article class="card fade relative rounded-2xl bg-ink-900/80 border border-ink-700 overflow-hidden">
      ${imgBlock}
      ${l.id != null ? starBtnHtml(l.id) : ''}
      <div class="p-4">
        <div class="flex items-end justify-between">
          <div>
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Текущая ставка</div>
            <div class="text-2xl font-extrabold text-white tnum font-mono">${l.bid ? fmt(l.bid) : '—'}</div>
          </div>
          <div class="text-right">
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Прогноз</div>
            <div class="text-base font-semibold text-slate-500">—</div>
          </div>
        </div>
        <div class="mt-3 inline-flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1 rounded-lg border bg-ink-800 text-slate-400 border-ink-600">
          <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Прогноз ещё не рассчитан
        </div>
        <div id="risk-${l.id}" class="mt-3"></div>
        <div class="mt-4 pt-3 border-t border-ink-700 flex items-center justify-end">
          <a href="${lotHref}" class="inline-flex items-center gap-1 text-[11px] text-gold-300/80 hover:text-gold-200">Подробнее <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>
        </div>
      </div>
    </article>`;
  }

  // --- Лот с прогнозом ---
  const delta = l.pred - l.bid;
  const pct = l.bid ? Math.round(delta / l.bid * 100) : 0;
  const up = delta >= 0;
  const c = confTone(l.conf);
  const total = (l.mv + l.np) || 1;
  const mvPct = Math.max(0, Math.min(100, Math.round(l.mv / total * 100)));
  const tone = up
    ? {chip:'bg-emerald-400/12 text-emerald-300 border-emerald-400/25', arrow:'trending-up'}
    : {chip:'bg-rose-400/12 text-rose-300 border-rose-400/25',          arrow:'trending-down'};

  return `
  <article class="card fade relative rounded-2xl bg-ink-900/80 border border-ink-700 overflow-hidden">
    ${imgBlock}
    ${l.id != null ? starBtnHtml(l.id) : ''}
    <div class="p-4">
      <div class="flex items-end justify-between">
        <div>
          <div class="text-[11px] uppercase tracking-wide text-slate-500">Прогноз</div>
          <div class="text-2xl font-extrabold text-white tnum font-mono">${fmt(l.pred)}</div>
        </div>
        <div class="text-right">
          <div class="text-[11px] uppercase tracking-wide text-slate-500">Ставка</div>
          <div class="text-base font-semibold text-slate-300 tnum font-mono">${l.bid ? fmt(l.bid) : '—'}</div>
        </div>
      </div>

      <div class="mt-3 inline-flex items-center gap-1.5 text-sm font-semibold px-2.5 py-1 rounded-lg border ${tone.chip}">
        <i data-lucide="${tone.arrow}" class="w-4 h-4"></i>
        <span class="tnum font-mono">${up?'+':'−'}${fmt(Math.abs(delta)).replace(' ₽','')} ₽</span>
        <span class="opacity-70 tnum">(${up?'+':''}${pct}%)</span>
        <span class="ml-1 text-[11px] font-medium opacity-80">${up?'недооценён':'переплата'}</span>
      </div>

      <div id="risk-${l.id}" class="mt-3"></div>

      <div class="mt-4">
        <div class="flex justify-between text-[11px] text-slate-500 mb-1">
          <span>Состав прогноза</span>
          <span>${mvPct>0?`металл ${mvPct}% · наценка ${100-mvPct}%`:'нумизматическая наценка 100%'}</span>
        </div>
        <div class="h-2 rounded-full bg-ink-700 overflow-hidden flex">
          <div class="h-full bg-gradient-to-r from-gold-400 to-gold-600" style="width:${mvPct}%"></div>
          <div class="h-full bg-gradient-to-r from-indigo-400 to-violet-500" style="width:${100-mvPct}%"></div>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-ink-700 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-16 h-1.5 rounded-full bg-ink-700 overflow-hidden">
            <div class="h-full ${c.bar}" style="width:${Math.round(l.conf*100)}%"></div>
          </div>
          <span class="text-[11px] ${c.txt} font-medium">${c.lbl} ${Math.round(l.conf*100)}%</span>
        </div>
        <div class="flex items-center gap-1 text-[11px] text-slate-500">
          <i data-lucide="layers" class="w-3.5 h-3.5"></i>
          <span>${METHOD[l.method]||l.method} · выборка ${l.size}</span>
        </div>
      </div>
    </div>
  </article>`;
}

function kpis(rowsAll){
  const withPred = rowsAll.filter(l => l.pred != null);
  const under = withPred.filter(l => l.pred >= l.bid).length;
  let bestPct = 0;
  if (withPred.length){
    const best = withPred.reduce((b,l)=> ((l.pred-l.bid)/(l.bid||1))>((b.pred-b.bid)/(b.bid||1))?l:b, withPred[0]);
    bestPct = best.bid ? Math.round((best.pred-best.bid)/best.bid*100) : 0;
  }
  const items = [
    {v: auctionMeta.lotsCount || rowsAll.length, l:'лотов', ic:'coins'},
    {v: withPred.length, l:'с прогнозом', ic:'sparkles'},
    {v: under, l:'недооценено', ic:'trending-up', tone:'text-emerald-300'},
    {v: (bestPct>=0?'+':'')+bestPct+'%', l:'лучшая сделка', ic:'flame', tone:'text-gold-300'},
  ];
  return items.map(i=>`
    <div class="rounded-xl bg-ink-900/70 border border-ink-700 px-4 py-3 min-w-[92px]">
      <div class="flex items-center gap-1.5 text-[11px] text-slate-500"><i data-lucide="${i.ic}" class="w-3.5 h-3.5"></i>${i.l}</div>
      <div class="text-xl font-bold mt-0.5 tnum ${i.tone||'text-white'}">${i.v}</div>
    </div>`).join('');
}

function chips(){
  const present = [...new Set(RAW.map(l=>l.metal))];
  const order = ['Au','Ag','Pd','Pt','Cu','Other'].filter(m=>present.includes(m));
  const metals = ['all', ...order];
  return metals.map(mk=>{
    const on = mk===activeMetal;
    const label = mk==='all' ? 'Все' : (METAL[mk]?.label||mk);
    const dot = mk==='all' ? 'bg-gold-400' : (METAL[mk]?.dot||'bg-slate-500');
    return `<button onclick="setMetal('${mk}')"
      class="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border transition
      ${on?'bg-gold-500/15 border-gold-500/40 text-gold-200':'bg-ink-900/60 border-ink-700 text-slate-300 hover:border-ink-500'}">
      <span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${label}</button>`;
  }).join('');
}

// Чипы категорий: значения берём прямо из данных (DB-поле category),
// сортируем по числу лотов в категории убыванием. Кол-во показываем в скобках.
function catChips(){
  const counts = new Map();
  for (const l of RAW){ if (l.cat){ counts.set(l.cat, (counts.get(l.cat)||0)+1); } }
  if (counts.size === 0) return '';
  const cats = [...counts.entries()].sort((a,b)=> b[1]-a[1]).map(e=>e[0]);
  const items = ['all', ...cats];
  return items.map(ck=>{
    const on = ck===activeCat;
    const label = ck==='all' ? 'Все' : ck;
    const cnt = ck==='all' ? RAW.length : counts.get(ck);
    return `<button onclick="setCat(${JSON.stringify(ck).replace(/"/g,'&quot;')})"
      class="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border transition
      ${on?'bg-gold-500/15 border-gold-500/40 text-gold-200':'bg-ink-900/60 border-ink-700 text-slate-300 hover:border-ink-500'}">
      ${label}<span class="text-[11px] opacity-60 tnum">${cnt}</span></button>`;
  }).join('');
}

function filtered(){
  const q = query.trim().toLowerCase();
  return RAW
    .filter(l => activeMetal==='all' || l.metal===activeMetal)
    .filter(l => activeCat==='all' || l.cat===activeCat)
    .filter(l => !underOnly || (l.pred != null && l.pred >= l.bid))
    .filter(l => !q || String(l.n).includes(q) || (l.t && l.t.toLowerCase().includes(q)))
    .slice()
    .sort((a,b) => {
      // Лоты с прогнозом — впереди, отсортированы по недооценённости; без прогноза — после, по номеру.
      const ap = a.pred != null, bp = b.pred != null;
      if (ap && bp){
        return (b.pred-b.bid)/(b.bid||1) - (a.pred-a.bid)/(a.bid||1);
      }
      if (ap !== bp) return ap ? -1 : 1;
      return (a.n||0) - (b.n||0);
    });
}

function pager(total){
  const pages = Math.ceil(total / PER_PAGE);
  if (pages <= 1) return '';
  const btn = (p, label, dis, cur) =>
    `<button ${dis?'disabled':''} onclick="goPage(${p})"
       class="min-w-[36px] h-9 px-2 rounded-lg text-sm border ${cur?'bg-gold-500/15 border-gold-500/40 text-gold-200':'bg-ink-900/60 border-ink-700 text-slate-300 hover:border-ink-500'} ${dis?'opacity-40 cursor-not-allowed':''}">${label}</button>`;
  let out = btn(page-1, '‹', page===1, false);
  const win = [];
  for (let p=1; p<=pages; p++){
    if (p===1 || p===pages || Math.abs(p-page)<=2) win.push(p);
    else if (win[win.length-1] !== '…') win.push('…');
  }
  out += win.map(p => p==='…'
    ? `<span class="px-1 text-slate-600">…</span>`
    : btn(p, p, false, p===page)).join('');
  out += btn(page+1, '›', page===pages, false);
  return out;
}

function render(){
  const rows = filtered();
  document.getElementById('kpis').innerHTML = kpis(RAW);
  const start = (page-1)*PER_PAGE;
  const slice = rows.slice(start, start+PER_PAGE);
  const grid = document.getElementById('grid');
  if (!rows.length){
    grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500">
      <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-3 text-ink-500"></i>
      Лотов не найдено по текущему фильтру.</div>`;
  } else {
    grid.innerHTML = slice.map(card).join('');
    loadRisks(slice);
  }
  document.getElementById('pager').innerHTML = pager(rows.length);
  document.getElementById('metalChips').innerHTML = chips();
  document.getElementById('catChips').innerHTML = catChips();
  const ut = document.getElementById('underToggle');
  ut.className = 'inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg border transition '
    + (underOnly ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200'
                 : 'bg-ink-900/60 border-ink-700 text-slate-300 hover:border-ink-500');
  const predCount = RAW.filter(l => l.pred != null).length;
  document.getElementById('footnote').textContent =
    `Аукцион ${auctionMeta.auctionNumber||'—'} · ${RAW.length} лот.${predCount?`, из них с прогнозом ${predCount}`:` (прогнозы ещё не рассчитаны)`}. Модель сравнивает монеты одного вида: металл + год + сохранность + тип.`;
  lucide.createIcons();
}
function setMetal(m){ activeMetal = m; page = 1; render(); }
function setCat(c){ activeCat = c; page = 1; render(); }
function toggleUnder(){ underOnly = !underOnly; page = 1; render(); }
function goPage(p){ page = p; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function showSkeletons(){
  const grid = document.getElementById('grid');
  grid.innerHTML = Array.from({length:6}).map(()=>`
    <div class="rounded-2xl bg-ink-900/80 border border-ink-700 overflow-hidden">
      <div class="h-44 skel"></div>
      <div class="p-4 space-y-3">
        <div class="h-7 w-2/3 skel rounded"></div>
        <div class="h-6 w-1/2 skel rounded"></div>
        <div class="h-2 w-full skel rounded"></div>
        <div class="h-3 w-full skel rounded"></div>
      </div>
    </div>`).join('');
}

function setStatus(){
  const num = auctionMeta.auctionNumber || '—';
  document.getElementById('auctionTitleNum').textContent = '№' + num;
  document.getElementById('brandSub').textContent = 'аукцион ' + num;
  const badge = document.getElementById('statusBadge');
  if (auctionMeta.isActive){
    badge.className = 'inline-flex items-center gap-2 text-xs font-medium text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1 mb-3';
    badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Аукцион идёт';
  } else {
    badge.className = 'inline-flex items-center gap-2 text-xs font-medium text-slate-300 bg-slate-500/10 border border-slate-500/20 rounded-full px-3 py-1 mb-3';
    badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> Аукцион завершён';
  }
}

async function init(){
  showSkeletons();
  const watchP = loadWatchlistSet();   // грузим избранное параллельно с прогнозами
  try {
    // 1) Determine current wolmar VIP auction. Allow ?auction=NNN override for testing.
    const override = new URLSearchParams(location.search).get('auction');
    if (override){
      auctionMeta.auctionNumber = override;
      // Статус конкретного аукциона тянем отдельно — иначе «идёт/завершён» неизвестен.
      try {
        const meta = await fetch('/api/auction-meta/' + encodeURIComponent(override)).then(r=>r.json());
        if (meta && meta.success){
          auctionMeta.isActive = meta.isActive;
          auctionMeta.lotsCount = meta.lotsCount;
        }
      } catch(_){ /* статус не критичен для показа лотов */ }
    } else {
      const m = await fetch('/api/current-vip-auction').then(r=>r.json());
      if (!m.success) throw new Error(m.error || 'Не удалось определить аукцион');
      auctionMeta = { auctionNumber: m.auctionNumber, isActive: m.isActive, lotsCount: m.lotsCount };
    }
    setStatus();

    // 2) Load predictions for that auction (single batch call)
    const rows = await fetch('/api/predictions/' + encodeURIComponent(auctionMeta.auctionNumber)).then(r=>r.json());
    if (!auctionMeta.lotsCount) auctionMeta.lotsCount = Array.isArray(rows) ? rows.length : 0;
    RAW = (Array.isArray(rows) ? rows : []).map(mapRow);   // показываем все лоты, даже без прогноза
    await watchP;   // дождёмся избранного, чтобы звёзды отрисовались сразу
    render();
  } catch (e){
    document.getElementById('grid').innerHTML =
      `<div class="col-span-full text-center py-16 text-rose-300">
         <i data-lucide="alert-triangle" class="w-10 h-10 mx-auto mb-3"></i>
         Ошибка загрузки: ${e.message}</div>`;
    lucide.createIcons();
  }
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value; page = 1; render();
});

init();
</script>
</body>

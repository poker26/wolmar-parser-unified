name: Numi
options:
  bundleIdPrefix: ru.begemot26
  deploymentTarget:
    iOS: "15.0"
targets:
  Numi:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Нуми"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Чтобы сфотографировать монету."
        NSPhotoLibraryUsageDescription: "Чтобы выбрать фотографии монеты."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.begemot26.numismat
        DEVELOPMENT_TEAM: "9J4X6PJX56"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  NumiTests:
    type: bundle.unit-test
    platform: iOS
    sources: ../iosTests
    dependencies:
      - target: Numi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
  NumiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: ../iosUITests
    dependencies:
      - target: Numi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
schemes:
  Numi:
    build:
      targets:
        Numi: all
    test:
      targets:
        - NumiTests
        - NumiUITests

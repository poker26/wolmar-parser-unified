name: Numi
options:
  bundleIdPrefix: ru.begemot26
  deploymentTarget:
    iOS: "15.0"
targets:
  Numi:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Нуми"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Чтобы сфотографировать монету."
        NSPhotoLibraryUsageDescription: "Чтобы выбрать фотографии монеты."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.begemot26.numismat
        DEVELOPMENT_TEAM: "9J4X6PJX56"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../ios-shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: "Build Kotlin framework"
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17)}"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          cd "$SRCROOT/../ios-shared"
          ./gradlew embedAndSignAppleFrameworkForXcode

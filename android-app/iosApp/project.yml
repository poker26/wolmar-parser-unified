name: Numi
options:
  bundleIdPrefix: ru.begemot26
  deploymentTarget:
    iOS: "15.0"
targets:
  Numi:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
      - path: ScreenshotPhotos
        optional: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Нуми"
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations:
          - ru
        CFBundleShortVersionString: "1.1.7"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Чтобы сфотографировать монету."
        NSPhotoLibraryUsageDescription: "Чтобы выбрать фотографии монеты."
        NumiPushEnabled: "$(NUMI_PUSH_ENABLED)"
        NumiAPNSEnvironment: "$(NUMI_APNS_ENVIRONMENT)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.begemot26.numismat
        DEVELOPMENT_TEAM: "9J4X6PJX56"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        NUMI_PUSH_ENABLED: "YES"
        NUMI_APNS_ENVIRONMENT: "production"
        NUMI_PUSH_ENTITLEMENTS: "Push.entitlements"
        CODE_SIGN_ENTITLEMENTS: "$(NUMI_PUSH_ENTITLEMENTS)"
  NumiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../iosTests
        excludes: [Fixtures]
      - path: ../iosTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Numi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
  NumiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: ../iosUITests
    dependencies:
      - target: Numi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
schemes:
  Numi:
    build:
      targets:
        Numi: all
    test:
      targets:
        - NumiTests
        - NumiUITests

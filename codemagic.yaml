workflows:
  numi-ios-first-light: &numi_ios_collection
    name: Numi iOS collection
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment: &numi_ios_environment
      xcode: latest
      groups:
        - appstore
      vars: &numi_ios_vars
        BUNDLE_ID: "ru.begemot26.numismat"
        XCODE_PROJECT: "android-app/iosApp/Numi.xcodeproj"
        XCODE_SCHEME: "Numi"
        IOS_DISTRIBUTION_TYPE: "IOS_APP_STORE"
    scripts:
      - name: Check Apple toolchain
        script: |
          set -e
          xcodebuild -version
          SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $SDK_VER"
          if [ "${SDK_VER%%.*}" -lt 26 ]; then
            echo "The App Store build requires the iOS 26 SDK or newer."
            exit 1
          fi
      - name: Generate Xcode project
        script: |
          set -e
          which xcodegen || brew install xcodegen
          cd android-app/iosApp
          xcodegen generate
      - name: Test collection on iPhone simulator
        script: |
          set -e
          mkdir -p build/ios-tests
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath build/ios-tests/Numi.xcresult \
            CODE_SIGN_IDENTITY=- > build/ios-tests/xcode-test.log 2>&1 || {
              tail -n 120 build/ios-tests/xcode-test.log
              exit 1
            }
          tail -n 50 build/ios-tests/xcode-test.log
          xcrun xcresulttool export attachments --path build/ios-tests/Numi.xcresult --output-path build/ios-tests/screenshots
      - name: Set up signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type "$IOS_DISTRIBUTION_TYPE" \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          if [ "$IOS_DISTRIBUTION_TYPE" = "IOS_APP_ADHOC" ]; then
            python3 scripts/check-ios-device-profile.py
          fi
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$(date +%s)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios-tests/**
  numi-ios-testflight:
    <<: *numi_ios_collection
    name: Numi iOS TestFlight
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload for internal testing; review submissions are separate release actions.
        submit_to_testflight: false
        submit_to_app_store: false
  numi-ios-adhoc:
    <<: *numi_ios_collection
    name: Numi iOS registered device
    environment:
      <<: *numi_ios_environment
      vars:
        <<: *numi_ios_vars
        IOS_DISTRIBUTION_TYPE: "IOS_APP_ADHOC"

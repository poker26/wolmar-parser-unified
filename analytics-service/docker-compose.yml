services:
  wolmar-analytics:
    build: .
    container_name: wolmar-analytics
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - ANALYTICS_PORT=3002
    volumes:
      # Frontend is static — bind-mount so edits don't need an image rebuild
      - ./public:/app/public
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/analytics', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

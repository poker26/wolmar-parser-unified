<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Риск торгов — Begemot Numismatics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/assets/dark.js"></script>
<link rel="stylesheet" href="/assets/dark.css">
<style>
  .row-red    { box-shadow: inset 3px 0 0 0 #fb7185; }
  .row-yellow { box-shadow: inset 3px 0 0 0 #fbbf24; }
  .row-green  { box-shadow: inset 3px 0 0 0 #34d399; }
  .drawer { transition: transform .25s ease; }
  .drawer.closed { transform: translateX(100%); }
  .pop { transition: opacity .15s ease; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1f2940; border-radius: 8px; }
</style>
</head>
<body class="font-sans text-slate-200 min-h-screen antialiased">

<header id="site-header"></header>

<main class="max-w-7xl mx-auto px-5 py-7">

  <!-- Intro -->
  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
        <i data-lucide="shield-alert" class="w-6 h-6 text-gold-400"></i>
        Риск накрутки торгов
      </h1>
      <p class="text-sm text-slate-400 mt-1">
        Стоит ли вступать в торги по лоту — или цена уже разгоняется подозрительными участниками.
      </p>
    </div>
    <div class="text-right">
      <div class="text-[11px] uppercase tracking-wide text-slate-500">Текущий аукцион</div>
      <div id="auc-num" class="text-xl font-bold text-white font-mono">—</div>
      <div id="auc-meta" class="text-[11px] text-slate-500">загрузка…</div>
    </div>
  </div>

  <!-- Summary -->
  <div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    <button data-f="red"   class="sum-card glass rounded-2xl p-4 text-left border border-ink-700/70 hover:border-rose-400/40 transition-colors">
      <div class="flex items-center gap-2 text-rose-300"><span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span><span class="text-xs font-semibold uppercase tracking-wide">Накручивается</span></div>
      <div class="text-3xl font-extrabold text-white mt-1" id="c-red">—</div>
    </button>
    <button data-f="yellow" class="sum-card glass rounded-2xl p-4 text-left border border-ink-700/70 hover:border-amber-400/40 transition-colors">
      <div class="flex items-center gap-2 text-amber-300"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span><span class="text-xs font-semibold uppercase tracking-wide">Внимание</span></div>
      <div class="text-3xl font-extrabold text-white mt-1" id="c-yellow">—</div>
    </button>
    <button data-f="green" class="sum-card glass rounded-2xl p-4 text-left border border-ink-700/70 hover:border-emerald-400/40 transition-colors">
      <div class="flex items-center gap-2 text-emerald-300"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span class="text-xs font-semibold uppercase tracking-wide">Чисто</span></div>
      <div class="text-3xl font-extrabold text-white mt-1" id="c-green">—</div>
    </button>
    <div class="glass rounded-2xl p-4 border border-ink-700/70">
      <div class="flex items-center gap-2 text-slate-400"><i data-lucide="layers" class="w-3.5 h-3.5"></i><span class="text-xs font-semibold uppercase tracking-wide">Лотов со ставками</span></div>
      <div class="text-3xl font-extrabold text-white mt-1" id="c-total">—</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="glass rounded-2xl p-3 mb-4 border border-ink-700/70 flex flex-wrap items-center gap-2">
    <div class="relative grow min-w-[220px]">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
      <input id="q" placeholder="Лот № или текст описания…" class="w-full bg-ink-850 border border-ink-700 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-gold-500/60">
    </div>
    <div id="chips" class="flex items-center gap-1 text-xs">
      <button data-f="all"    class="chip px-3 py-1.5 rounded-lg bg-ink-700/70 text-white">Все</button>
      <button data-f="red"    class="chip px-3 py-1.5 rounded-lg text-slate-300 hover:bg-ink-700/60">🔴</button>
      <button data-f="yellow" class="chip px-3 py-1.5 rounded-lg text-slate-300 hover:bg-ink-700/60">🟡</button>
      <button data-f="green"  class="chip px-3 py-1.5 rounded-lg text-slate-300 hover:bg-ink-700/60">🟢</button>
    </div>
    <select id="sort" class="bg-ink-850 border border-ink-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gold-500/60">
      <option value="risk">Сначала рискованные</option>
      <option value="lot">По номеру лота</option>
      <option value="bid_desc">Цена ↓</option>
      <option value="bidders_desc">Больше ставивших</option>
      <option value="flagged_desc">Больше помеченных</option>
    </select>
    <div class="text-xs text-slate-500 ml-auto" id="shown">—</div>
  </div>

  <!-- Board -->
  <div class="glass rounded-2xl border border-ink-700/70 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-[11px] uppercase tracking-wide text-slate-500 bg-ink-850/60">
          <tr>
            <th class="text-left font-semibold px-4 py-3 w-16">Лот</th>
            <th class="text-left font-semibold px-4 py-3">Монета</th>
            <th class="text-left font-semibold px-4 py-3 w-20">Сост.</th>
            <th class="text-right font-semibold px-4 py-3 w-28">Ставка</th>
            <th class="text-center font-semibold px-4 py-3 w-24">Ставивших</th>
            <th class="text-center font-semibold px-4 py-3 w-24">Помечено</th>
            <th class="text-left font-semibold px-4 py-3 w-44">Вердикт</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="board-empty" class="hidden py-16 text-center text-slate-500">Ничего не найдено</div>
    <div id="board-load" class="py-16 text-center text-slate-500">
      <i data-lucide="loader-2" class="w-6 h-6 inline-block animate-spin"></i>
      <div class="mt-2 text-sm">Считаем риск по всем лотам аукциона…</div>
    </div>
  </div>

</main>

<!-- ===== Lot drawer ===== -->
<div id="drawer-bg" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden"></div>
<aside id="drawer" class="drawer closed fixed top-0 right-0 h-full w-full max-w-2xl bg-ink-900 border-l border-ink-700 z-50 overflow-y-auto">
  <div id="drawer-body" class="p-6"></div>
</aside>

<!-- ===== User popover ===== -->
<div id="pop" class="pop fixed z-[60] hidden w-80 bg-ink-850 border border-ink-700 rounded-2xl shadow-glow p-4"></div>

<script>
const D = window.DARK;
const SIGNAL_LABELS = {
  fast_bids: 'Быстрые ставки', autobid_traps: 'Ловушки автобида', linked: 'Связанные аккаунты',
  carousel: 'Карусель', self_boost: 'Саморазгон', decoy: 'Приманки', pricing: 'Разгон цен',
  circular: 'Круговые покупки', abandonment: 'Замирание', technical: 'Технические',
};
const VERDICT = {
  red:    { lbl: 'НАКРУЧИВАЕТСЯ', badge: 'bg-rose-500/15 text-rose-300 border-rose-400/30',    dot: 'bg-rose-400' },
  yellow: { lbl: 'ВНИМАНИЕ',      badge: 'bg-amber-500/15 text-amber-300 border-amber-400/30',  dot: 'bg-amber-400' },
  green:  { lbl: 'ЧИСТО',         badge: 'bg-emerald-500/15 text-emerald-300 border-emerald-400/30', dot: 'bg-emerald-400' },
};
let BOARD = [];      // all lots
let AUC = null;      // auction number
let filter = 'all';
let query = '';

D.mountHeader('analytics', 'риск торгов');

// ---- boot ----
(async function init() {
  try {
    const vip = await fetch('/api/current-vip-auction').then(r => r.json());
    AUC = vip.auctionNumber;
    document.getElementById('auc-num').textContent = '№ ' + AUC;
    document.getElementById('auc-meta').textContent = (vip.lotsCount || 0).toLocaleString('ru-RU') + ' лотов' + (vip.isActive ? ' · идёт' : '');
    const data = await fetch('/api/analytics/auction-risk/' + AUC).then(r => r.json());
    if (!data.success) throw new Error('board failed');
    BOARD = data.lots || [];
    renderSummary(data.summary);
    document.getElementById('board-load').classList.add('hidden');
    render();
  } catch (e) {
    document.getElementById('board-load').innerHTML = '<div class="text-rose-300 text-sm">Не удалось загрузить доску риска: ' + D.escHtml(e.message) + '</div>';
  }
  if (window.lucide) lucide.createIcons();
})();

function renderSummary(s) {
  s = s || {};
  document.getElementById('c-red').textContent    = (s.red || 0).toLocaleString('ru-RU');
  document.getElementById('c-yellow').textContent = (s.yellow || 0).toLocaleString('ru-RU');
  document.getElementById('c-green').textContent  = (s.green || 0).toLocaleString('ru-RU');
  document.getElementById('c-total').textContent  = (s.withBids || 0).toLocaleString('ru-RU');
}

// ---- filtering / sorting ----
const RISK_ORD = { red: 0, yellow: 1, green: 2 };
function render() {
  let list = BOARD.slice();
  if (filter !== 'all') list = list.filter(l => l.tone === filter);
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(l => String(l.lotNumber).toLowerCase() === q
      || String(l.lotNumber).toLowerCase().includes(q)
      || (l.coin || '').toLowerCase().includes(q)
      || (l.leaderLogin || '').toLowerCase().includes(q));
  }
  const sort = document.getElementById('sort').value;
  list.sort((a, b) => {
    switch (sort) {
      case 'lot': return (parseInt(a.lotNumber) || 0) - (parseInt(b.lotNumber) || 0);
      case 'bid_desc': return (b.winningBid || 0) - (a.winningBid || 0);
      case 'bidders_desc': return (b.bidders || 0) - (a.bidders || 0);
      case 'flagged_desc': return (b.flaggedBidders || 0) - (a.flaggedBidders || 0);
      default: // risk
        if (RISK_ORD[a.tone] !== RISK_ORD[b.tone]) return RISK_ORD[a.tone] - RISK_ORD[b.tone];
        return (b.leaderSusp || 0) - (a.leaderSusp || 0);
    }
  });

  const rows = document.getElementById('rows');
  const empty = document.getElementById('board-empty');
  document.getElementById('shown').textContent = list.length.toLocaleString('ru-RU') + ' из ' + BOARD.length.toLocaleString('ru-RU');
  if (!list.length) { rows.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  rows.innerHTML = list.slice(0, 600).map(l => {
    const v = VERDICT[l.tone] || VERDICT.green;
    const flShare = l.bidders > 0 ? Math.round((l.flaggedBidders / l.bidders) * 100) : 0;
    return `<tr class="row-${l.tone} border-t border-ink-800 hover:bg-ink-800/50 cursor-pointer" onclick="openLot(${l.id})">
      <td class="px-4 py-3 font-mono text-slate-300">${D.escHtml(l.lotNumber)}</td>
      <td class="px-4 py-3 max-w-md"><div class="truncate text-slate-200" title="${D.escHtml(l.coin || '')}">${D.escHtml((l.coin || '').slice(0, 90))}</div>
        <div class="text-[11px] text-slate-500 truncate">${D.escHtml(l.category || '')}</div></td>
      <td class="px-4 py-3 text-slate-400">${D.escHtml(l.condition || '—')}</td>
      <td class="px-4 py-3 text-right font-mono text-slate-200">${D.fmt(l.winningBid)}</td>
      <td class="px-4 py-3 text-center text-slate-300">${l.bidders || 0}</td>
      <td class="px-4 py-3 text-center ${l.flaggedBidders ? 'text-amber-300' : 'text-slate-500'}">${l.flaggedBidders || 0}${l.flaggedBidders ? ` <span class="text-[10px] text-slate-500">${flShare}%</span>` : ''}</td>
      <td class="px-4 py-3">
        <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md border text-[11px] font-semibold ${v.badge}"><span class="w-1.5 h-1.5 rounded-full ${v.dot}"></span>${v.lbl}</span>
        <div class="text-[11px] text-slate-500 mt-1 truncate max-w-[16rem]" title="${D.escHtml(l.topReason || '')}">${D.escHtml(l.topReason || '')}</div>
      </td>
    </tr>`;
  }).join('');
  if (list.length > 600) {
    rows.innerHTML += `<tr><td colspan="7" class="px-4 py-3 text-center text-[11px] text-slate-500">Показаны первые 600. Уточните фильтр или поиск.</td></tr>`;
  }
}

// ---- controls wiring ----
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
document.getElementById('sort').addEventListener('change', render);
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => setFilter(c.dataset.f)));
document.querySelectorAll('.sum-card').forEach(c => c.addEventListener('click', () => setFilter(c.dataset.f)));
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.f === f;
    c.className = 'chip px-3 py-1.5 rounded-lg ' + (on ? 'bg-ink-700/70 text-white' : 'text-slate-300 hover:bg-ink-700/60');
  });
  render();
}

// ---- lot drawer ----
async function openLot(id) {
  const bg = document.getElementById('drawer-bg'), dr = document.getElementById('drawer'), body = document.getElementById('drawer-body');
  bg.classList.remove('hidden');
  requestAnimationFrame(() => dr.classList.remove('closed'));
  body.innerHTML = '<div class="py-20 text-center text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 inline-block animate-spin"></i></div>';
  if (window.lucide) lucide.createIcons();
  try {
    const d = await fetch('/api/analytics/lot-risk/' + id).then(r => r.json());
    if (!d.success) throw new Error('lot failed');
    body.innerHTML = renderLot(d);
  } catch (e) {
    body.innerHTML = '<div class="py-20 text-center text-rose-300 text-sm">Не удалось загрузить лот</div>';
  }
  if (window.lucide) lucide.createIcons();
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('closed');
  document.getElementById('drawer-bg').classList.add('hidden');
  hidePop();
}
document.getElementById('drawer-bg').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hidePop(); closeDrawer(); } });

function renderLot(d) {
  const lot = d.lot, v = VERDICT[d.tone] || VERDICT.green, m = d.metrics || {};
  const reasons = (d.reasons || []).map(r => `<li class="flex gap-2"><span class="${v.dot.replace('bg-', 'text-')} mt-1">•</span><span>${D.escHtml(r)}</span></li>`).join('');
  const metricChips = [
    ['users', `${m.bidders || 0} ставивших`],
    ['flag', `${m.flaggedBidders || 0} помечено`],
    m.ringBidders ? ['link', `${m.ringBidders} в кольцах`] : null,
    m.pingpongPair ? ['repeat', `ping-pong ${m.pingpongEvents}×`] : null,
  ].filter(Boolean).map(([ic, t]) => `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-ink-800 border border-ink-700 text-xs text-slate-300"><i data-lucide="${ic}" class="w-3.5 h-3.5"></i>${t}</span>`).join('');

  const roster = (d.bidders || []).map(b => {
    const tone = D.riskTone(b.band);
    const badges = [];
    if (b.isLeader) badges.push('<span class="px-1.5 py-0.5 rounded bg-gold-500/15 text-gold-300 border border-gold-500/30 text-[10px] font-semibold">ЛИДЕР</span>');
    if (b.inRing) badges.push('<span class="px-1.5 py-0.5 rounded bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-400/30 text-[10px] font-semibold">КОЛЬЦО</span>');
    if (b.hasAuto) badges.push('<span class="px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-400/30 text-[10px] font-semibold">АВТО</span>');
    const sigJson = encodeURIComponent(JSON.stringify({ login: b.login, score: b.score, band: b.band, signals: b.signals }));
    return `<tr class="border-t border-ink-800">
      <td class="px-3 py-2.5">
        <button class="text-gold-300 hover:text-gold-200 hover:underline decoration-dotted underline-offset-2 font-medium" onclick="showPop(event,'${sigJson}')">${D.escHtml(b.login)}</button>
        <div class="flex flex-wrap gap-1 mt-1">${badges.join('')}</div>
      </td>
      <td class="px-3 py-2.5 text-center text-slate-300">${b.bids}</td>
      <td class="px-3 py-2.5 text-right font-mono text-slate-200">${D.fmt(b.maxBid)}</td>
      <td class="px-3 py-2.5 text-right">
        <div class="inline-flex items-center gap-2">
          <span class="font-mono ${tone.txt}">${b.score}</span>
          <span class="px-1.5 py-0.5 rounded border text-[10px] font-semibold ${tone.badge}">${D.escHtml(b.band)}</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="flex items-start justify-between gap-3 mb-4">
    <div>
      <div class="text-[11px] uppercase tracking-wide text-slate-500">Лот № ${D.escHtml(lot.lotNumber)} · аукцион ${D.escHtml(lot.auctionNumber)}</div>
      <h2 class="text-lg font-bold text-white leading-snug mt-1">${D.escHtml((lot.coin || '').slice(0, 160))}</h2>
    </div>
    <button onclick="closeDrawer()" class="shrink-0 grid place-items-center w-9 h-9 rounded-lg text-slate-400 hover:text-white hover:bg-ink-700/60"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>

  <div class="rounded-2xl border ${v.badge.split(' ').filter(c=>c.startsWith('border')).join(' ')} bg-ink-850/60 p-4 mb-4">
    <div class="flex items-center gap-2 mb-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md border text-xs font-bold ${v.badge}"><span class="w-2 h-2 rounded-full ${v.dot}"></span>${v.lbl}</span>
    </div>
    <ul class="text-sm text-slate-300 space-y-1">${reasons}</ul>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
    <div class="glass rounded-xl p-3 border border-ink-700/70"><div class="text-[11px] text-slate-500">Категория</div><div class="text-slate-200">${D.escHtml(lot.category || '—')}</div></div>
    <div class="glass rounded-xl p-3 border border-ink-700/70"><div class="text-[11px] text-slate-500">Состояние · год</div><div class="text-slate-200">${D.escHtml(lot.condition || '—')} · ${lot.year || '—'}</div></div>
    <div class="glass rounded-xl p-3 border border-ink-700/70"><div class="text-[11px] text-slate-500">Текущая ставка</div><div class="text-slate-200 font-mono">${D.fmt(lot.winningBid)}</div></div>
    <div class="glass rounded-xl p-3 border border-ink-700/70"><div class="text-[11px] text-slate-500">Лидер</div><div>${D.userLink ? D.userLink(lot.winnerLogin) : D.escHtml(lot.winnerLogin || '—')}</div></div>
  </div>

  <div class="flex flex-wrap gap-2 mb-4">${metricChips}</div>

  <div class="glass rounded-2xl border border-ink-700/70 overflow-hidden mb-4">
    <div class="px-4 py-2.5 text-[11px] uppercase tracking-wide text-slate-500 bg-ink-850/60">Кто ставил (${(d.bidders || []).length})</div>
    <table class="w-full text-sm">
      <thead class="text-[11px] uppercase tracking-wide text-slate-500">
        <tr><th class="text-left font-semibold px-3 py-2">Участник</th><th class="text-center font-semibold px-3 py-2 w-16">Ставок</th><th class="text-right font-semibold px-3 py-2 w-28">Макс.</th><th class="text-right font-semibold px-3 py-2 w-44">Риск</th></tr>
      </thead>
      <tbody>${roster}</tbody>
    </table>
  </div>

  <a href="/lot.html?id=${lot.id}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gold-500/15 text-gold-300 border border-gold-500/30 hover:bg-gold-500/25 text-sm font-semibold">
    <i data-lucide="external-link" class="w-4 h-4"></i> Открыть карточку лота
  </a>`;
}

// ---- user popover (thin profile from lot bidder signals) ----
function showPop(ev, json) {
  ev.stopPropagation();
  const b = JSON.parse(decodeURIComponent(json));
  const tone = D.riskTone(b.band);
  const sigs = Object.entries(b.signals || {}).filter(([, v]) => v > 0).sort((a, c) => c[1] - a[1]);
  const bars = sigs.length ? sigs.map(([k, v]) => `
    <div class="flex items-center gap-2 text-xs">
      <span class="w-28 shrink-0 text-slate-400">${SIGNAL_LABELS[k] || k}</span>
      <div class="grow h-1.5 rounded-full bg-ink-700 overflow-hidden"><div class="h-full ${tone.bar}" style="width:${Math.min(100, v)}%"></div></div>
      <span class="w-7 text-right font-mono ${tone.txt}">${v}</span>
    </div>`).join('') : '<div class="text-xs text-slate-500">Сигналов не зафиксировано.</div>';
  const pop = document.getElementById('pop');
  pop.innerHTML = `
    <div class="flex items-center justify-between mb-2">
      <div class="font-semibold text-white">${D.escHtml(b.login)}</div>
      <span class="px-2 py-0.5 rounded border text-[10px] font-semibold ${tone.badge}">${D.escHtml(b.band)} · ${b.score}</span>
    </div>
    <div class="space-y-1.5 mb-3">${bars}</div>
    <a href="/user.html?login=${encodeURIComponent(b.login)}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-gold-300 hover:text-gold-200"><i data-lucide="user" class="w-3.5 h-3.5"></i>Полный профиль участника</a>`;
  pop.classList.remove('hidden');
  const r = ev.target.getBoundingClientRect();
  let top = r.bottom + 6, left = r.left;
  if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
  if (top + 240 > window.innerHeight) top = r.top - 246;
  pop.style.top = Math.max(8, top) + 'px';
  pop.style.left = Math.max(8, left) + 'px';
  if (window.lucide) lucide.createIcons();
}
function hidePop() { document.getElementById('pop').classList.add('hidden'); }
document.addEventListener('click', e => {
  const pop = document.getElementById('pop');
  if (!pop.classList.contains('hidden') && !pop.contains(e.target)) hidePop();
});
</script>
</body>
</html>
